<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机器小车控制台</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 头部导航 -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-robot"></i> 机器小车控制台</h1>
                <div class="connection-status">
                    <span id="connectionStatus" class="status-indicator">
                        <i class="fas fa-circle"></i> 未连接
                    </span>
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- Tab导航 -->
            <div class="tab-navigation">
                <button class="tab-btn active" data-tab="control">
                    <i class="fas fa-gamepad"></i> 机器人控制
                </button>
                <button class="tab-btn" data-tab="route-planner">
                    <i class="fas fa-route"></i> 路线规划
                </button>
                <button class="tab-btn" onclick="window.open('http://localhost:8080/diagnostic.html', '_blank')">
                    <i class="fas fa-stethoscope"></i> 系统诊断
                </button>
            </div>

            <!-- Tab内容区域 -->
            <div class="tab-content">
                <!-- 机器人控制Tab -->
                <div id="control-tab" class="tab-panel active">
                    <!-- 两列布局 -->
                    <div class="two-column-layout">
                        <!-- 左列：遥控控制和路径导航 -->
                        <div class="left-column">
                            <!-- 遥控控制 -->
                            <div class="control-panel">
                                <div class="panel-section">
                                    <h3><i class="fas fa-gamepad"></i> 遥控控制</h3>
                                    
                                    <!-- 控制模式选择 -->
                                    <div class="control-mode-selector">
                                        <label class="mode-label">控制模式:</label>
                                        <div class="mode-buttons">
                                            <button class="mode-btn active" data-mode="joystick">
                                                <i class="fas fa-gamepad"></i> 摇杆控制
                                            </button>
                                            <button class="mode-btn" data-mode="keyboard">
                                                <i class="fas fa-keyboard"></i> 键盘控制
                                            </button>
                                        </div>
                                    </div>

                                    <!-- 摇杆控制区域 -->
                                    <div id="joystick-control" class="control-area active">
                                        <div class="joystick-container">
                                            <div class="joystick-wrapper">
                                                <button class="rotation-btn left" data-action="rotate_left" title="左转">
                                                    <i class="fas fa-chevron-left"></i>
                                                </button>
                                                <div id="joystick" class="joystick" title="拖拽摇杆控制移动">
                                                    <div class="joystick-knob"></div>
                                                </div>
                                                <button class="rotation-btn right" data-action="rotate_right" title="右转">
                                                    <i class="fas fa-chevron-right"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 键盘控制区域 -->
                                    <div id="keyboard-control" class="control-area">
                                        <div class="keyboard-controls">
                                            <div class="keyboard-layout">
                                                <div class="key-row">
                                                    <div class="key-spacer"></div>
                                                    <button class="key-btn" data-key="w" title="前进">W</button>
                                                    <div class="key-spacer"></div>
                                                </div>
                                                <div class="key-row">
                                                    <button class="key-btn" data-key="a" title="左移">A</button>
                                                    <button class="key-btn" data-key="s" title="后退">S</button>
                                                    <button class="key-btn" data-key="d" title="右移">D</button>
                                                </div>
                                                <div class="key-row">
                                                    <div class="key-spacer"></div>
                                                    <button class="key-btn" data-key="q" title="左转">Q</button>
                                                    <button class="key-btn" data-key="e" title="右转">E</button>
                                                    <div class="key-spacer"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 速度显示 -->
                                    <div class="speed-display-panel">
                                        <div class="speed-item">
                                            <label>前进/后退:</label>
                                            <span id="linearSpeed" class="speed-value">0.0 m/s</span>
                                        </div>
                                        <div class="speed-item">
                                            <label>左移/右移:</label>
                                            <span id="lateralSpeed" class="speed-value">0.0 m/s</span>
                                        </div>
                                        <div class="speed-item">
                                            <label>旋转:</label>
                                            <span id="angularSpeed" class="speed-value">0.0 rad/s</span>
                                        </div>
                                    </div>

                                    <!-- 最大速度设置 -->
                                    <div class="max-speed-settings-panel">
                                        <h4><i class="fas fa-tachometer-alt"></i> 最大速度设置</h4>
                                        <div class="speed-slider-group">
                                            <div class="speed-slider-item">
                                                <label for="maxLinearSpeed">前进/后退速度 (m/s):</label>
                                                <div class="slider-container">
                                                    <input type="range" id="maxLinearSpeed" min="0.1" max="0.5" step="0.05" value="0.2">
                                                    <span id="maxLinearSpeedValue" class="slider-value">0.2</span>
                                                </div>
                                            </div>
                                            <div class="speed-slider-item">
                                                <label for="maxLateralSpeed">侧向移动速度 (m/s):</label>
                                                <div class="slider-container">
                                                    <input type="range" id="maxLateralSpeed" min="0.1" max="0.5" step="0.05" value="0.2">
                                                    <span id="maxLateralSpeedValue" class="slider-value">0.2</span>
                                                </div>
                                            </div>
                                            <div class="speed-slider-item">
                                                <label for="maxAngularSpeed">旋转速度 (rad/s):</label>
                                                <div class="slider-container">
                                                    <input type="range" id="maxAngularSpeed" min="0.1" max="0.5" step="0.05" value="0.2">
                                                    <span id="maxAngularSpeedValue" class="slider-value">0.2</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 紧急停止和复位 -->
                                    <div class="emergency-controls">
                                        <button id="emergencyStopBtn" class="emergency-btn" title="紧急停止">
                                            <i class="fas fa-stop"></i> 紧急停止
                                        </button>
                                        <button id="resetBtn" class="reset-btn" title="复位">
                                            <i class="fas fa-redo"></i> 复位
                                        </button>
                                    </div>
                                </div>
                            </div>




                <!-- 路径导航功能 -->
                <div class="panel-section">
                    <h3><i class="fas fa-route"></i> 路径导航</h3>
                        
                        <!-- 录制控制区域 -->
                        <div class="waypoint-recording-controls">
                            <div class="path-input">
                                <label for="waypointPathName">路径名称:</label>
                                <input type="text" id="waypointPathName" placeholder="输入路径名称" maxlength="50">
                            </div>
                            <div class="recording-controls">
                                <button id="startWaypointRecordingBtn" class="waypoint-btn start">
                                    <i class="fas fa-play"></i> 开始录制
                                </button>
                                <button id="stopWaypointRecordingBtn" class="waypoint-btn stop" disabled>
                                    <i class="fas fa-stop"></i> 停止录制
                                </button>
                                <button id="saveWaypointsBtn" class="waypoint-btn save">
                                    <i class="fas fa-save"></i> 保存路径
                                </button>
                            </div>
                            <div class="recording-status">
                                <span id="waypointRecordingStatus">未录制</span>
                                <span id="waypointRecordingTime">00:00:00</span>
                            </div>
                        </div>

                        <!-- 跟踪控制区域 -->
                        <div class="waypoint-following-controls">
                            <div class="current-location-display">
                                <label>当前位置:</label>
                                <div id="currentLocationInfo" class="location-info">
                                    <span id="currentLocationText">未检测到APRILTAG</span>
                                </div>
                            </div>
                            <div class="destination-selection">
                                <label for="destinationNodeSelect">选择终点:</label>
                                <select id="destinationNodeSelect" class="destination-node-select">
                                    <option value="">请选择终点...</option>
                                </select>
                            </div>
                            <div class="following-controls">
                                <button id="startWaypointFollowingBtn" class="waypoint-btn start" disabled>
                                    <i class="fas fa-play"></i> 开始跟踪
                                </button>
                                <button id="pauseWaypointFollowingBtn" class="waypoint-btn pause" disabled>
                                    <i class="fas fa-pause"></i> 暂停跟踪
                                </button>
                                <button id="stopWaypointFollowingBtn" class="waypoint-btn stop" disabled>
                                    <i class="fas fa-stop"></i> 停止跟踪
                                </button>
                            </div>
                            <div class="following-status">
                                <span id="waypointFollowingStatus">未跟踪</span>
                            </div>
                        </div>


                    </div>
                </div>

                        <!-- 右列：显示区域 -->
                        <div class="right-column">
                <!-- 机器人状态 -->
                <div class="robot-status">
                    <h3><i class="fas fa-info-circle"></i> 机器人状态</h3>
                    <div class="status-grid">
                        <div class="status-item">
                            <label>当前状态:</label>
                            <span id="robotCurrentState" class="state-indicator">--</span>
                        </div>
                        <div class="status-item">
                            <label>当前定位:</label>
                            <span id="robotCurrentLocation" class="location-indicator">未定位</span>
                        </div>
                        <div class="status-item">
                            <label>位置 (X, Y, Z):</label>
                            <span id="robotPosition">--, --, --</span>
                        </div>
                        <div class="status-item">
                            <label>方向 (Roll, Pitch, Yaw):</label>
                            <span id="robotOrientation">--, --, --</span>
                        </div>
                        <div class="status-item">
                            <label>速度 (线性, 角速度):</label>
                            <span id="robotVelocity">--, --</span>
                        </div>
                        <div class="status-item">
                            <label>电池电量:</label>
                            <span id="batteryLevel">--%</span>
                        </div>
                    </div>
                </div>

                <!-- 摄像头视频 -->
                <div class="video-section">
                    <div class="video-section-header">
                    <h3><i class="fas fa-video"></i> 摄像头画面</h3>
                        <div class="camera-toggle-controls">
                            <button id="cameraSelectBtn" class="camera-select-btn" title="切换摄像头: 前置 / 后置">
                                <i class="fas fa-camera"></i> <span id="cameraSelectLabel">前置</span>
                            </button>
                            <button id="cameraToggleBtn" class="camera-toggle-btn" title="切换视图: RGB / 深度 / 叠加">
                                <i class="fas fa-eye"></i> <span id="cameraToggleLabel">RGB</span>
                            </button>
                        </div>
                    </div>
                    <div class="video-container">
                        <img id="cameraImage" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQwIiBoZWlnaHQ9IjQ4MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzMzIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPuaXoOazleiDveWKoOi9vTwvdGV4dD48L3N2Zz4=" alt="摄像头画面">
                        <img id="depthImage" class="depth-image-overlay" src="" alt="深度图像" style="display: none;">
                        <div class="video-overlay">
                            <div class="video-info">
                                <span id="videoFPS">FPS: --</span>
                                <span id="videoSize">640x480</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AprilTag检测显示 -->
                <div class="apriltag-section">
                    <h3><i class="fas fa-qrcode"></i> AprilTag检测</h3>
                    <div class="apriltag-info">
                        <div class="detection-status">
                            <span id="apriltagStatus">未检测到AprilTag</span>
                        </div>
                        <div class="detected-tags" id="detectedTags">
                            <!-- 检测到的标签信息将在这里显示 -->
                        </div>
                    </div>
                </div>

                <!-- 超声波传感器显示 -->
                <div class="ultrasonic-section">
                    <h3><i class="fas fa-wave-square"></i> 超声波传感器</h3>
                    <div class="ultrasonic-sensors-grid" id="ultrasonicSensorsGrid">
                        <!-- 传感器数据将在这里动态显示 -->
                    </div>
                </div>
                        </div>
                    </div>
                </div>

                <!-- 路线规划Tab -->
                <div id="route-planner-tab" class="tab-panel">
                    <div class="route-planner-container">
                        <!-- 工具栏 -->
                        <div class="route-planner-toolbar">
                            <div class="toolbar-group">
                                <button id="addNodeBtn" class="toolbar-btn" title="添加节点">
                                    <i class="fas fa-plus-circle"></i> 添加节点
                                </button>
                                <button id="connectModeBtn" class="toolbar-btn" title="连接模式（双击节点也可进入连接模式）">
                                    <i class="fas fa-link"></i> 连接模式
                                </button>
                                <button id="loadWaypointsBtn" class="toolbar-btn" title="加载路径文件">
                                    <i class="fas fa-folder-open"></i> 加载路径
                                </button>
                                <input type="file" id="waypointsFileInput" accept=".json" style="display: none;">
                                <button id="saveRouteBtn" class="toolbar-btn" title="保存路线配置">
                                    <i class="fas fa-save"></i> 保存路线
                                </button>
                                <button id="importRouteBtn" class="toolbar-btn" title="导入路线配置">
                                    <i class="fas fa-upload"></i> 导入路线
                                </button>
                                <input type="file" id="routeFileInput" accept=".json" style="display: none;">
                                <button id="clearCanvasBtn" class="toolbar-btn" title="清空画布">
                                    <i class="fas fa-trash"></i> 清空
                                </button>
                            </div>
                            <div class="toolbar-group">
                                <button id="zoomInBtn" class="toolbar-btn" title="放大">
                                    <i class="fas fa-search-plus"></i>
                                </button>
                                <button id="zoomOutBtn" class="toolbar-btn" title="缩小">
                                    <i class="fas fa-search-minus"></i>
                                </button>
                                <button id="resetViewBtn" class="toolbar-btn" title="重置视图">
                                    <i class="fas fa-home"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 主要内容区域 -->
                        <div class="route-planner-content">
                            <!-- 画布区域 -->
                            <div class="route-planner-canvas-container">
                                <svg id="routePlannerCanvas" class="route-planner-canvas">
                                    <defs>
                                        <!-- 箭头标记定义 -->
                                        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                                            <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                                        </marker>
                                    </defs>
                                    <!-- 连接线将在这里动态添加 -->
                                    <g id="connections-layer"></g>
                                    <!-- 节点将在这里动态添加 -->
                                    <g id="nodes-layer"></g>
                                </svg>
                            </div>

                            <!-- 右侧面板 -->
                            <div class="route-planner-sidebar">
                                <!-- 属性面板 -->
                                <div class="route-planner-properties">
                                    <h3><i class="fas fa-edit"></i> 站点属性</h3>
                                    <div id="nodePropertiesPanel" class="properties-panel">
                                        <p class="no-selection">未选择站点</p>
                                    </div>
                                </div>

                                <!-- 连接属性面板 -->
                                <div class="route-planner-connection-properties">
                                    <h3><i class="fas fa-link"></i> 连接属性</h3>
                                    <div id="connectionPropertiesPanel" class="properties-panel">
                                        <p class="no-selection">未选择连接（单击连接线选择）</p>
                                    </div>
                                </div>

                                <!-- 路径列表 -->
                                <div class="route-planner-files">
                                    <h3><i class="fas fa-file"></i> 已加载路径</h3>
                                    <div id="loadedFilesList" class="files-list">
                                        <p class="no-files">暂无加载的路径</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- 底部状态栏 -->
        <footer class="footer">
            <div class="footer-content">
                <div class="system-info">
                    <span><i class="fas fa-clock"></i> <span id="currentTime">--:--:--</span></span>
                    <span><i class="fas fa-signal"></i> <span id="connectionQuality">--</span></span>
                </div>
                <div class="control-hints">
                    <span>麦克纳姆轮全向移动：WASD+QE键或摇杆控制</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
    <script src="js/joystick.js?v=2"></script>
    <script src="js/ros2-bridge.js?v=4"></script>
    <script src="js/robot-control.js?v=2"></script>
    <script src="js/waypoint-system.js?v=2"></script>
    <script src="js/route-planner.js?v=1"></script>
    <script src="js/main.js?v=3"></script>
</body>
</html>
