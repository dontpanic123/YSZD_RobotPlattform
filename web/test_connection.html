<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background-color: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 5px; max-height: 400px; overflow-y: auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>WebSocket连接测试</h1>
    <div id="status" class="status disconnected">连接状态: 检查中...</div>
    <div id="logs" class="log"></div>

    <script src="js/ros2-bridge.js?v=4"></script>
    <script>
        function log(message) {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logs.innerHTML += '<div>[' + timestamp + '] ' + message + '</div>';
            logs.scrollTop = logs.scrollHeight;
            console.log('[' + timestamp + '] ' + message);
        }

        function updateStatus(connected) {
            const status = document.getElementById('status');
            if (connected) {
                status.textContent = '连接状态: 已连接';
                status.className = 'status connected';
            } else {
                status.textContent = '连接状态: 未连接';
                status.className = 'status disconnected';
            }
        }

        // 等待ROS2桥接初始化
        function waitForBridge() {
            if (window.ros2Bridge) {
                log('✅ ROS2桥接已加载');
                
                // 监听连接状态
                const checkConnection = () => {
                    const connected = window.ros2Bridge.isConnected();
                    updateStatus(connected);
                    
                    if (connected) {
                        log('✅ WebSocket连接成功');
                        setupStateSubscription();
                    } else {
                        log('❌ WebSocket未连接，1秒后重试...');
                        setTimeout(checkConnection, 1000);
                    }
                };
                
                checkConnection();
                
                // 设置状态订阅
                function setupStateSubscription() {
                    log('📡 设置状态订阅...');
                    window.ros2Bridge.subscribe('/robot_state', (message) => {
                        log('📨 收到状态消息: ' + JSON.stringify(message));
                    });
                    log('✅ 状态订阅已设置');
                    
                    // 每5秒检查一次连接状态
                    setInterval(() => {
                        const connected = window.ros2Bridge.isConnected();
                        updateStatus(connected);
                        if (connected) {
                            log('💓 连接正常');
                        } else {
                            log('❌ 连接断开');
                        }
                    }, 5000);
                }
                
            } else {
                log('⏳ 等待ROS2桥接加载...');
                setTimeout(waitForBridge, 100);
            }
        }

        waitForBridge();
    </script>
</body>
</html>
