<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket测试</title>
</head>
<body>
    <h1>WebSocket连接测试</h1>
    <div id="status">连接状态: 检查中...</div>
    <button id="testEmergency">测试紧急停止</button>
    <button id="testNavigation">测试自动导航</button>
    <div id="logs"></div>

    <script src="js/ros2-bridge.js?v=4"></script>
    <script>
        function log(message) {
            const logs = document.getElementById('logs');
            logs.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
            console.log(message);
        }

        function updateStatus(connected) {
            const status = document.getElementById('status');
            status.textContent = '连接状态: ' + (connected ? '已连接' : '未连接');
            status.style.color = connected ? 'green' : 'red';
        }

        // 等待ROS2桥接初始化
        function waitForBridge() {
            if (window.ros2Bridge) {
                log('✅ ROS2桥接已加载');
                
                // 监听连接状态
                const checkConnection = () => {
                    const connected = window.ros2Bridge.isConnected();
                    updateStatus(connected);
                    
                    if (connected) {
                        log('✅ WebSocket连接成功');
                    } else {
                        log('❌ WebSocket未连接，1秒后重试...');
                        setTimeout(checkConnection, 1000);
                    }
                };
                
                checkConnection();
                
                // 测试紧急停止
                document.getElementById('testEmergency').addEventListener('click', () => {
                    log('🚨 测试紧急停止...');
                    if (window.ros2Bridge.isConnected()) {
                        const emergencyMsg = { data: 'true' };
                        const success = window.ros2Bridge.publish('/emergency_stop', emergencyMsg);
                        log('📤 紧急停止消息发送结果: ' + success);
                    } else {
                        log('❌ WebSocket未连接，无法发送消息');
                    }
                });
                
                // 测试自动导航
                document.getElementById('testNavigation').addEventListener('click', () => {
                    log('🎯 测试自动导航...');
                    if (window.ros2Bridge.isConnected()) {
                        const goalMsg = {
                            pose: {
                                position: { x: 1.0, y: 0.0, z: 0.0 },
                                orientation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
                            }
                        };
                        const success = window.ros2Bridge.publish('/goal_pose', goalMsg);
                        log('📤 导航目标点发送结果: ' + success);
                    } else {
                        log('❌ WebSocket未连接，无法发送消息');
                    }
                });
                
            } else {
                log('⏳ 等待ROS2桥接加载...');
                setTimeout(waitForBridge, 100);
            }
        }

        waitForBridge();
    </script>
</body>
</html>
